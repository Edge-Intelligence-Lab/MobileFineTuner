name: operator-ci

on:
  push:
    paths:
      - ".github/workflows/operator-ci.yml"
      - "operator/**"
      - "examples/**"
      - "scripts/run_training_smoke.sh"
      - "scripts/generate_qwen_hf_fixtures.py"
      - "scripts/requirements-qwen*-validation.txt"
      - "scripts/test_qwen_training_cli.py"
      - "scripts/run_qwen_mac_stability.py"
      - "scripts/test_qwen_mac_stability.py"
      - "scripts/test_energy_scheduler.py"
      - "scripts/check_release_tree.sh"
      - "scripts/check_local_assets.sh"
      - "scripts/asset_paths.py"
      - "scripts/lib/**"
      - "scripts/android/**"
      - "android-visualizer/**"
      - "docs/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/operator-ci.yml"
      - "operator/**"
      - "examples/**"
      - "scripts/run_training_smoke.sh"
      - "scripts/generate_qwen_hf_fixtures.py"
      - "scripts/requirements-qwen*-validation.txt"
      - "scripts/test_qwen_training_cli.py"
      - "scripts/run_qwen_mac_stability.py"
      - "scripts/test_qwen_mac_stability.py"
      - "scripts/test_energy_scheduler.py"
      - "scripts/check_release_tree.sh"
      - "scripts/check_local_assets.sh"
      - "scripts/asset_paths.py"
      - "scripts/lib/**"
      - "scripts/android/**"
      - "android-visualizer/**"
      - "docs/**"
      - "README.md"

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Install release audit dependency
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Release tree audit
        run: bash scripts/check_release_tree.sh

      - name: Configure
        run: >
          cmake -S operator -B operator/build
          -DCMAKE_BUILD_TYPE=Release
          -DOPERATORS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build operator/build -j4

      - name: Test
        run: ctest --test-dir operator/build --output-on-failure

      - name: Install package
        run: cmake --install operator/build --prefix operator/install

      - name: Consumer package smoke
        run: |
          mkdir -p /tmp/operators-consumer
          cat > /tmp/operators-consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(operators_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(Operators REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE Operators::operators)
          EOF
          cat > /tmp/operators-consumer/main.cpp <<'EOF'
          #include "finetune_ops/core/autograd_engine.h"
          #include "finetune_ops/core/backward_functions.h"
          #include "finetune_ops/core/device.h"
          #include "finetune_ops/core/dtype.h"
          #include "finetune_ops/core/lm_loss.h"
          #include "finetune_ops/core/logger.h"
          #include "finetune_ops/core/memory_efficient_attention.h"
          #include "finetune_ops/core/memory_manager.h"
          #include "finetune_ops/core/ops.h"
          #include "finetune_ops/core/performance_monitor.h"
          #include "finetune_ops/core/step_arena.h"
          #include "finetune_ops/core/tensor.h"
          #include "finetune_ops/core/tokenizer.h"
          #include "finetune_ops/core/tokenizer_bpe.h"
          #include "finetune_ops/core/tokenizer_gemma.h"
          #include "finetune_ops/core/utils.h"
          #include "finetune_ops/data/mmlu_dataset.h"
          #include "finetune_ops/data/wikitext2_dataset.h"
          #include "finetune_ops/graph/auto_model.h"
          #include "finetune_ops/graph/gemma_lora_injector.h"
          #include "finetune_ops/graph/gemma_model.h"
          #include "finetune_ops/graph/gpt2_model.h"
          #include "finetune_ops/graph/lora_injector.h"
          #include "finetune_ops/graph/lora_saver.h"
          #include "finetune_ops/graph/model_registry.h"
          #include "finetune_ops/graph/qwen_model.h"
          #include "finetune_ops/graph/safetensors_loader.h"
          #include "finetune_ops/nn/lora_linear.h"
          #include "finetune_ops/optim/adam.h"
          #include "finetune_ops/optim/auto_trainer.h"
          #include "finetune_ops/optim/gemma_trainer.h"
          #include "finetune_ops/optim/optimizer.h"
          #include "finetune_ops/optim/trainer.h"
          #include "mobile_finetuner/mobile_finetuner.h"
          int main() { ops::energy::PowerMonitor monitor; return monitor.suggest_sleep_ms(0); }
          EOF
          cmake -S /tmp/operators-consumer -B /tmp/operators-consumer/build -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/operator/install"
          cmake --build /tmp/operators-consumer/build -j4

      - name: MobileFineTuner package smoke
        run: |
          mkdir -p /tmp/mft-consumer
          cat > /tmp/mft-consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(mft_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(MobileFineTuner REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE MobileFineTuner::operators)
          EOF
          cat > /tmp/mft-consumer/main.cpp <<'EOF'
          #include "mobile_finetuner/mobile_finetuner.h"
          int main() { ops::energy::PowerMonitor monitor; return monitor.suggest_sleep_ms(0); }
          EOF
          cmake -S /tmp/mft-consumer -B /tmp/mft-consumer/build -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/operator/install"
          cmake --build /tmp/mft-consumer/build -j4

      - name: Android visualizer build
        run: |
          cd android-visualizer
          ./gradlew \
            :mft-sdk:assembleRelease \
            :mft-sdk:assembleAndroidTest \
            :mft-sdk:publishReleasePublicationToLocalReleaseRepository \
            :sdk-sample:assembleDebug \
            :app:assembleDebug

      - name: Five-model smoke
        run: bash scripts/run_training_smoke.sh

      - name: Qwen CLI integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/test_qwen_training_cli.py --binary examples/qwen_lora_finetune/build/train_wikitext --mmlu-binary examples/qwen_lora_finetune/build/train_mmlu

      - name: Mac stability controller integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/test_qwen_mac_stability.py --binary examples/qwen_lora_finetune/build/train_wikitext

      - name: Energy scheduler integration
        run: python3 scripts/test_energy_scheduler.py --binary examples/qwen_lora_finetune/build/train_wikitext

  qwen-reference-parity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [dense, hybrid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only reference dependencies
        shell: bash
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ matrix.architecture }}" = hybrid ]; then
            python -m pip install -r scripts/requirements-qwen35-validation.txt
          else
            python -m pip install -r scripts/requirements-qwen-validation.txt
          fi
      - name: Build native parity executable and CLI
        run: |
          cmake -S operator -B operator/build -DCMAKE_BUILD_TYPE=Release
          cmake --build operator/build -j2
          cmake -S examples/qwen_lora_finetune -B examples/qwen_lora_finetune/build -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/qwen_lora_finetune/build -j2
      - name: Generate independent tiny references
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ "${{ matrix.architecture }}" = hybrid ]; then
            python scripts/generate_qwen_hf_fixtures.py --qwen35 --output runs/qwen_hf_fixtures
          else
            python scripts/generate_qwen_hf_fixtures.py --output runs/qwen_hf_fixtures
          fi
      - name: Check all logits, adapter gradients, updates and reloads
        env:
          MFT_QWEN_HF_FIXTURES: ${{ github.workspace }}/runs/qwen_hf_fixtures
        run: ctest --test-dir operator/build --output-on-failure
      - name: Load native adapters with PEFT
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/generate_qwen_hf_fixtures.py --output runs/qwen_hf_fixtures --verify-native
      - name: Exercise CLI accumulation tail and diagnostic exports
        run: python scripts/test_qwen_training_cli.py --binary examples/qwen_lora_finetune/build/train_wikitext --mmlu-binary examples/qwen_lora_finetune/build/train_mmlu
